name: Public validation and draft release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests
        run: sh scripts/test.sh
      - name: DSP sanitizers
        run: SANITIZE=1 sh tests/dsp/run.sh
      - name: Install pinned cross compiler
        run: |
          mkdir -p build/toolchain
          curl -fL --retry 3 https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o build/toolchain/zig.tar.xz
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  build/toolchain/zig.tar.xz' | sha256sum -c -
          tar -xJf build/toolchain/zig.tar.xz -C build/toolchain
      - name: Build Linux ARM64
        env:
          ZIG: ./build/toolchain/zig-x86_64-linux-0.16.0/zig
        run: sh scripts/build-dsp.sh
      - name: Package and verify Public only
        run: |
          node scripts/package-profiles.mjs --public
          node scripts/verify-profiles.mjs --public
          node scripts/release-metadata.mjs
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-metadata.mjs "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: oktonik-public
          path: |
            dist/oktonik-module.tar.gz
            dist/SHA256SUMS
            dist/release-next.json
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'skerryvibe/oktonik'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: oktonik-public
          path: release-assets
      - name: Create draft for human acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set --
          case "$RELEASE_TAG" in *-*) set -- --prerelease ;; esac
          gh release create "$RELEASE_TAG" release-assets/oktonik-module.tar.gz release-assets/SHA256SUMS release-assets/release-next.json --verify-tag --draft "$@" --title "OKTONIK $RELEASE_TAG" --notes "Requires Schwung 1.6.2+. Complete hardware acceptance and release notes before publishing. After publication, verify the download and promote release-next.json to the repository release.json."
