<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="356" viewBox="0 0 1040 356" role="img" aria-labelledby="title desc"><title id="title">SHIFT + STEP / SHORTCUTS</title><desc id="desc">Sixteen step buttons: 2 MIDI, 3 SETUP, 5 tempo, 6 metronome, 7 strum menu, 8 right-hand pads, 9 scale, 10 full velocity, 13 Schwung tools, 14 new clip, 15 double loop, 16 quantize.</desc><style>text{font-family:Arial,sans-serif} .strong{font-weight:700}</style><rect width="1040" height="356" rx="18" fill="#101a26"/><text x="32" y="46" font-size="28" fill="#fff" class="strong">SHIFT + STEP / SHORTCUTS</text><text x="32" y="80" font-size="14" fill="#9fb3c8" >HOLD SHIFT  ·  ICONS UNDER THE STEPS LIGHT  ·  A LIT STEP MEANS THE SETTING IS ON</text><rect x="32" y="118" width="52" height="40" rx="12" fill="#1b2633" stroke="#354557"/><text x="58" y="144" font-size="15" fill="#7f93a8" text-anchor="middle" class="strong">1</text><rect x="93" y="118" width="52" height="40" rx="12" fill="#e3ebf3" stroke="#354557"/><text x="119" y="144" font-size="15" fill="#152336" text-anchor="middle" class="strong">2</text><text x="119" y="182" font-size="12" fill="#f1cf82" text-anchor="middle" class="strong">MIDI</text><text x="119" y="200" font-size="10" fill="#9fb3c8" text-anchor="middle">page</text><rect x="154" y="118" width="52" height="40" rx="12" fill="#e3ebf3" stroke="#354557"/><text x="180" y="144" font-size="15" fill="#152336" text-anchor="middle" class="strong">3</text><text x="180" y="182" font-size="12" fill="#f1cf82" text-anchor="middle" class="strong">SETUP</text><text x="180" y="200" font-size="10" fill="#9fb3c8" text-anchor="middle">QNT</text><text x="180" y="214" font-size="10" fill="#9fb3c8" text-anchor="middle">COUNT</text><rect x="215" y="118" width="52" height="40" rx="12" fill="#1b2633" stroke="#354557"/><text x="241" y="144" font-size="15" fill="#7f93a8" text-anchor="middle" class="strong">4</text><rect x="276" y="118" width="52" height="40" rx="12" fill="#e3ebf3" stroke="#354557"/><text x="302" y="144" font-size="15" fill="#152336" text-anchor="middle" class="strong">5</text><text x="302" y="182" font-size="12" fill="#f1cf82" text-anchor="middle" class="strong">TEMPO</text><text x="302" y="200" font-size="10" fill="#9fb3c8" text-anchor="middle">from</text><text x="302" y="214" font-size="10" fill="#9fb3c8" text-anchor="middle">Move</text><rect x="337" y="118" width="52" height="40" rx="12" fill="#e3ebf3" stroke="#354557"/><text x="363" y="144" font-size="15" fill="#152336" text-anchor="middle" class="strong">6</text><text x="363" y="182" font-size="12" fill="#f1cf82" text-anchor="middle" class="strong">METRO</text><text x="363" y="200" font-size="10" fill="#9fb3c8" text-anchor="middle">OFF</text><text x="363" y="214" font-size="10" fill="#9fb3c8" text-anchor="middle">ON REC</text><rect x="398" y="118" width="52" height="40" rx="12" fill="#e3ebf3" stroke="#354557"/><text x="424" y="144" font-size="15" fill="#152336" text-anchor="middle" class="strong">7</text><text x="424" y="182" font-size="12" fill="#f1cf82" text-anchor="middle" class="strong">STRUM</text><text x="424" y="200" font-size="10" fill="#9fb3c8" text-anchor="middle">menu</text><rect x="459" y="118" width="52" height="40" rx="12" fill="#e3ebf3" stroke="#354557"/><text x="485" y="144" font-size="15" fill="#152336" text-anchor="middle" class="strong">8</text><text x="485" y="182" font-size="12" fill="#f1cf82" text-anchor="middle" class="strong">R.PAD</text><text x="485" y="200" font-size="10" fill="#9fb3c8" text-anchor="middle">MEL/BASS</text><rect x="520" y="118" width="52" height="40" rx="12" fill="#e3ebf3" stroke="#354557"/><text x="546" y="144" font-size="15" fill="#152336" text-anchor="middle" class="strong">9</text><text x="546" y="182" font-size="12" fill="#f1cf82" text-anchor="middle" class="strong">SCALE</text><text x="546" y="200" font-size="10" fill="#9fb3c8" text-anchor="middle">key,</text><text x="546" y="214" font-size="10" fill="#9fb3c8" text-anchor="middle">melody</text><rect x="581" y="118" width="52" height="40" rx="12" fill="#e3ebf3" stroke="#354557"/><text x="607" y="144" font-size="15" fill="#152336" text-anchor="middle" class="strong">10</text><text x="607" y="182" font-size="12" fill="#f1cf82" text-anchor="middle" class="strong">FULL</text><text x="607" y="200" font-size="10" fill="#9fb3c8" text-anchor="middle">velocity</text><rect x="642" y="118" width="52" height="40" rx="12" fill="#1b2633" stroke="#354557"/><text x="668" y="144" font-size="15" fill="#7f93a8" text-anchor="middle" class="strong">11</text><rect x="703" y="118" width="52" height="40" rx="12" fill="#1b2633" stroke="#354557"/><text x="729" y="144" font-size="15" fill="#7f93a8" text-anchor="middle" class="strong">12</text><rect x="764" y="118" width="52" height="40" rx="12" fill="#2a2f38" stroke="#354557"/><text x="790" y="144" font-size="15" fill="#7f93a8" text-anchor="middle" class="strong">13</text><text x="790" y="182" font-size="12" fill="#7f93a8" text-anchor="middle" class="strong">Schwung</text><text x="790" y="200" font-size="10" fill="#9fb3c8" text-anchor="middle">tools</text><rect x="825" y="118" width="52" height="40" rx="12" fill="#e3ebf3" stroke="#354557"/><text x="851" y="144" font-size="15" fill="#152336" text-anchor="middle" class="strong">14</text><text x="851" y="182" font-size="12" fill="#f1cf82" text-anchor="middle" class="strong">NEW</text><text x="851" y="200" font-size="10" fill="#9fb3c8" text-anchor="middle">clip</text><rect x="886" y="118" width="52" height="40" rx="12" fill="#e3ebf3" stroke="#354557"/><text x="912" y="144" font-size="15" fill="#152336" text-anchor="middle" class="strong">15</text><text x="912" y="182" font-size="12" fill="#f1cf82" text-anchor="middle" class="strong">DOUBLE</text><text x="912" y="200" font-size="10" fill="#9fb3c8" text-anchor="middle">loop</text><rect x="947" y="118" width="52" height="40" rx="12" fill="#e3ebf3" stroke="#354557"/><text x="973" y="144" font-size="15" fill="#152336" text-anchor="middle" class="strong">16</text><text x="973" y="182" font-size="12" fill="#f1cf82" text-anchor="middle" class="strong">QNT</text><text x="973" y="200" font-size="10" fill="#9fb3c8" text-anchor="middle">clip</text><text x="973" y="214" font-size="10" fill="#9fb3c8" text-anchor="middle">on/off</text><text x="32" y="262" font-size="17" fill="#eaf0f5" >METRO step: blue = ON (while Move plays), red = REC (while recording).</text><text x="32" y="294" font-size="16" fill="#9fb3c8" >SETUP, STRUM and SCALE open a page of knobs; press the same step or Back to close.</text><text x="32" y="324" font-size="16" fill="#9fb3c8" >Step 13 stays Schwung's tool menu. Positions follow Move where Move has the same function.</text></svg>
