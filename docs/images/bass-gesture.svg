<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="468" viewBox="0 0 1040 468" role="img" aria-labelledby="title desc"><title id="title">BASS GESTURE / KEEP THE CHORD, MOVE THE BASS</title><desc id="desc">Five stages from C to C/E and back to C, without retriggering the chord. Release all pads to end the gesture.</desc><style>text{font-family:Arial,sans-serif} .strong{font-weight:700}</style><rect width="1040" height="468" rx="18" fill="#101a26"/><text x="32" y="46" font-size="28" fill="#fff" class="strong">BASS GESTURE / KEEP THE CHORD, MOVE THE BASS</text><text x="32" y="80" font-size="15" fill="#9fb3c8" >BASS ON  ·  GEST ON  ·  CHORD + BASS SUST OFF</text><rect x="32" y="112" width="184" height="245" rx="12" fill="#192a3a" stroke="#354557"/><text x="48" y="144" font-size="18" fill="#8ea9c0" >1</text><text x="48" y="181" font-size="16" fill="#eaf0f5" >Hold C</text><text x="48" y="238" font-size="32" fill="#b3c4ff" class="strong">C</text><text x="48" y="277" font-size="14" fill="#f1cf82" >C chord + C bass</text><text x="48" y="326" font-size="14" fill="#9fb3c8" >Held: C</text><text x="217" y="242" font-size="12" fill="#9fb3c8" >→</text><rect x="230" y="112" width="184" height="245" rx="12" fill="#192a3a" stroke="#354557"/><text x="246" y="144" font-size="18" fill="#8ea9c0" >2</text><text x="246" y="181" font-size="16" fill="#eaf0f5" >Press Em as well</text><text x="246" y="238" font-size="32" fill="#b3c4ff" class="strong">C/E</text><text x="246" y="277" font-size="14" fill="#f1cf82" >Only bass changes</text><text x="246" y="326" font-size="14" fill="#9fb3c8" >Held: C + Em</text><text x="415" y="242" font-size="12" fill="#9fb3c8" >→</text><rect x="428" y="112" width="184" height="245" rx="12" fill="#192a3a" stroke="#354557"/><text x="444" y="144" font-size="18" fill="#8ea9c0" >3</text><text x="444" y="181" font-size="16" fill="#eaf0f5" >Release C</text><text x="444" y="238" font-size="32" fill="#b3c4ff" class="strong">C/E</text><text x="444" y="277" font-size="14" fill="#f1cf82" >No new notes</text><text x="444" y="326" font-size="14" fill="#9fb3c8" >Held: Em</text><text x="613" y="242" font-size="12" fill="#9fb3c8" >→</text><rect x="626" y="112" width="184" height="245" rx="12" fill="#192a3a" stroke="#354557"/><text x="642" y="144" font-size="18" fill="#8ea9c0" >4</text><text x="642" y="181" font-size="16" fill="#eaf0f5" >Press C again</text><text x="642" y="238" font-size="32" fill="#b3c4ff" class="strong">C</text><text x="642" y="277" font-size="14" fill="#f1cf82" >Only bass changes</text><text x="642" y="326" font-size="14" fill="#9fb3c8" >Held: C + Em</text><text x="811" y="242" font-size="12" fill="#9fb3c8" >→</text><rect x="824" y="112" width="184" height="245" rx="12" fill="#192a3a" stroke="#354557"/><text x="840" y="144" font-size="18" fill="#8ea9c0" >5</text><text x="840" y="181" font-size="16" fill="#eaf0f5" >Release all</text><text x="840" y="238" font-size="32" fill="#b3c4ff" class="strong">OFF</text><text x="840" y="277" font-size="14" fill="#f1cf82" >Gesture ends</text><text x="840" y="326" font-size="14" fill="#9fb3c8" >Held: None</text><text x="32" y="402" font-size="18" fill="#eaf0f5" >One C chord anchor. New presses choose bass; releases never select another chord.</text><text x="32" y="438" font-size="16" fill="#9fb3c8" >With HOLD or PEDAL, notes follow sustain after the gesture ends.</text></svg>
