xt-anchor="middle" class="strong"></text><rect x="676" y="346" width="110" height="64" rx="12" fill="#141d28" stroke="#354557"/><text x="731" y="384" font-size="16" fill="#fff" text-anchor="middle" class="strong"></text><rect x="798" y="346" width="110" height="64" rx="12" fill="#141d28" stroke="#354557"/><text x="853" y="384" font-size="16" fill="#fff" text-anchor="middle" class="strong"></text><rect x="920" y="346" width="110" height="64" rx="12" fill="#234470" stroke="#354557"/><text x="975" y="384" font-size="16" fill="#fff" text-anchor="middle" class="strong">STOP</text><text x="32" y="440" font-size="16" fill="#eaf0f5" >Press a clip to play it (queued to the next bar while playing). Yellow outline: the clip that plays.</text><text x="32" y="470" font-size="16" fill="#9fb3c8" >Copy + clip, then another clip: copy. Delete + clip: clear. Track 1/2/3 shows that part's steps.</text><text x="32" y="500" font-size="16" fill="#9fb3c8" >Knobs: LEN, RATE, QNT (this clip), PAGE, COUNT, METRO.</text></svg>
