<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc"><title id="title">MIDI / ONE PLAYER, THREE VOICES</title><desc id="desc">Chord, melody and bass each have their own output route and channel leading to a receiving instrument.</desc><style>text{font-family:Arial,sans-serif} .strong{font-weight:700}</style><rect width="1040" height="560" rx="18" fill="#101a26"/><text x="32" y="46" font-size="28" fill="#fff" class="strong">MIDI / ONE PLAYER, THREE VOICES</text><text x="32" y="80" font-size="14" fill="#9fb3c8" >ONE HARMONY  ·  THREE INDEPENDENT MIDI PARTS  ·  YOUR INSTRUMENTS MAKE THE SOUND</text><rect x="32" y="122" width="232" height="320" rx="12" fill="#192a3a" stroke="#354557"/><text x="56" y="220" font-size="29" fill="#fff" class="strong">OKTONIK</text><text x="56" y="261" font-size="20" fill="#eaf0f5" >Live harmony</text><text x="56" y="294" font-size="16" fill="#9fb3c8" >Chords + modifiers</text><text x="56" y="325" font-size="16" fill="#9fb3c8" >Bass Gesture</text><text x="287" y="178" font-size="30" fill="#9fb3c8" >→</text><rect x="330" y="122" width="270" height="88" rx="12" fill="#303b63" stroke="#354557"/><text x="350" y="157" font-size="20" fill="#fff" class="strong">CHORD</text><text x="350" y="187" font-size="17" fill="#b8c9e0" >C.OUT + C.CH</text><text x="624" y="178" font-size="30" fill="#9fb3c8" >→</text><rect x="671" y="122" width="335" height="88" rx="12" fill="#192a3a" stroke="#354557"/><text x="692" y="158" font-size="18" fill="#eaf0f5" >Receiving instrument</text><text x="692" y="187" font-size="17" fill="#9fb3c8" >e.g. piano</text><text x="287" y="294" font-size="30" fill="#9fb3c8" >→</text><rect x="330" y="238" width="270" height="88" rx="12" fill="#303b63" stroke="#354557"/><text x="350" y="273" font-size="20" fill="#fff" class="strong">MELODY</text><text x="350" y="303" font-size="17" fill="#b8c9e0" >M.OUT + M.CH</text><text x="624" y="294" font-size="30" fill="#9fb3c8" >→</text><rect x="671" y="238" width="335" height="88" rx="12" fill="#192a3a" stroke="#354557"/><text x="692" y="274" font-size="18" fill="#eaf0f5" >Receiving instrument</text><text x="692" y="303" font-size="17" fill="#9fb3c8" >e.g. lead synth</text><text x="287" y="410" font-size="30" fill="#9fb3c8" >→</text><rect x="330" y="354" width="270" height="88" rx="12" fill="#303b63" stroke="#354557"/><text x="350" y="389" font-size="20" fill="#fff" class="strong">BASS</text><text x="350" y="419" font-size="17" fill="#b8c9e0" >B.OUT + B.CH</text><text x="624" y="410" font-size="30" fill="#9fb3c8" >→</text><rect x="671" y="354" width="335" height="88" rx="12" fill="#192a3a" stroke="#354557"/><text x="692" y="390" font-size="18" fill="#eaf0f5" >Receiving instrument</text><text x="692" y="419" font-size="17" fill="#9fb3c8" >e.g. bass synth</text><text x="32" y="490" font-size="16" fill="#eaf0f5" >Set the receiver to the matching route/channel. These are examples, not fixed track assignments.</text><text x="32" y="525" font-size="16" fill="#f1cf82" >Separate channels are important when parts use different CC64 sustain behaviour.</text></svg>
