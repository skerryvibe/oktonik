<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="612" viewBox="0 0 1040 612" role="img" aria-labelledby="title desc"><title id="title">OKTONIK / THE PLAYING SURFACE</title><desc id="desc">Four rows of eight pads: II SUB BORROW STOP on top left; DOM MAJ/MIN SUS2 SUS4 below; G Am Bdim C above C Dm Em F; sixteen melody pads on the right.</desc><style>text{font-family:Arial,sans-serif} .strong{font-weight:700}</style><rect width="1040" height="612" rx="18" fill="#101a26"/><text x="32" y="46" font-size="28" fill="#fff" class="strong">OKTONIK / THE PLAYING SURFACE</text><text x="32" y="78" font-size="14" fill="#9fb3c8" >PLAYER VIEW  ·  C MAJOR TRIADS  ·  NO MODIFIERS OR PAD EDITS</text><text x="32" y="117" font-size="17" fill="#f1cf82" >LEFT HAND — HARMONY</text><text x="554" y="117" font-size="17" fill="#adbcff" >RIGHT HAND — MELODY</text><rect x="32" y="140" width="110" height="72" rx="12" fill="#51432b" stroke="#354557"/><text x="87" y="182" font-size="20" fill="#fff" text-anchor="middle" class="strong">II</text><rect x="154" y="140" width="110" height="72" rx="12" fill="#51432b" stroke="#354557"/><text x="209" y="182" font-size="20" fill="#fff" text-anchor="middle" class="strong">SUB</text><rect x="276" y="140" width="110" height="72" rx="12" fill="#51432b" stroke="#354557"/><text x="331" y="182" font-size="20" fill="#fff" text-anchor="middle" class="strong">BORROW</text><rect x="398" y="140" width="110" height="72" rx="12" fill="#234470" stroke="#354557"/><text x="453" y="182" font-size="20" fill="#fff" text-anchor="middle" class="strong">STOP</text><rect x="554" y="140" width="110" height="72" rx="12" fill="#303b63" stroke="#354557"/><text x="609" y="182" font-size="20" fill="#fff" text-anchor="middle" class="strong">M13</text><rect x="676" y="140" width="110" height="72" rx="12" fill="#303b63" stroke="#354557"/><text x="731" y="182" font-size="20" fill="#fff" text-anchor="middle" class="strong">M14</text><rect x="798" y="140" width="110" height="72" rx="12" fill="#303b63" stroke="#354557"/><text x="853" y="182" font-size="20" fill="#fff" text-anchor="middle" class="strong">M15</text><rect x="920" y="140" width="110" height="72" rx="12" fill="#303b63" stroke="#354557"/><text x="975" y="182" font-size="20" fill="#fff" text-anchor="middle" class="strong">M16</text><rect x="32" y="226" width="110" height="72" rx="12" fill="#51432b" stroke="#354557"/><text x="87" y="268" font-size="14" fill="#fff" text-anchor="middle" class="strong">DOM / V</text><rect x="154" y="226" width="110" height="72" rx="12" fill="#51432b" stroke="#354557"/><text x="209" y="268" font-size="14" fill="#fff" text-anchor="middle" class="strong">MAJ/MIN</text><rect x="276" y="226" width="110" height="72" rx="12" fill="#51432b" stroke="#354557"/><text x="331" y="268" font-size="20" fill="#fff" text-anchor="middle" class="strong">SUS2</text><rect x="398" y="226" width="110" height="72" rx="12" fill="#51432b" stroke="#354557"/><text x="453" y="268" font-size="20" fill="#fff" text-anchor="middle" class="strong">SUS4</text><rect x="554" y="226" width="110" height="72" rx="12" fill="#303b63" stroke="#354557"/><text x="609" y="268" font-size="20" fill="#fff" text-anchor="middle" class="strong">M9</text><rect x="676" y="226" width="110" height="72" rx="12" fill="#303b63" stroke="#354557"/><text x="731" y="268" font-size="20" fill="#fff" text-anchor="middle" class="strong">M10</text><rect x="798" y="226" width="110" height="72" rx="12" fill="#303b63" stroke="#354557"/><text x="853" y="268" font-size="20" fill="#fff" text-anchor="middle" class="strong">M11</text><rect x="920" y="226" width="110" height="72" rx="12" fill="#303b63" stroke="#354557"/><text x="975" y="268" font-size="20" fill="#fff" text-anchor="middle" class="strong">M12</text><rect x="32" y="312" width="110" height="72" rx="12" fill="#e3ebf3" stroke="#354557"/><text x="87" y="354" font-size="20" fill="#152336" text-anchor="middle" class="strong">G</text><rect x="154" y="312" width="110" height="72" rx="12" fill="#e3ebf3" stroke="#354557"/><text x="209" y="354" font-size="20" fill="#152336" text-anchor="middle" class="strong">Am</text><rect x="276" y="312" width="110" height="72" rx="12" fill="#e3ebf3" stroke="#354557"/><text x="331" y="354" font-size="20" fill="#152336" text-anchor="middle" class="strong">Bdim</text><rect x="398" y="312" width="110" height="72" rx="12" fill="#e3ebf3" stroke="#354557"/><text x="453" y="354" font-size="20" fill="#152336" text-anchor="middle" class="strong">C</text><rect x="554" y="312" width="110" height="72" rx="12" fill="#303b63" stroke="#354557"/><text x="609" y="354" font-size="20" fill="#fff" text-anchor="middle" class="strong">M5</text><rect x="676" y="312" width="110" height="72" rx="12" fill="#303b63" stroke="#354557"/><text x="731" y="354" font-size="20" fill="#fff" text-anchor="middle" class="strong">M6</text><rect x="798" y="312" width="110" height="72" rx="12" fill="#303b63" stroke="#354557"/><text x="853" y="354" font-size="20" fill="#fff" text-anchor="middle" class="strong">M7</text><rect x="920" y="312" width="110" height="72" rx="12" fill="#303b63" stroke="#354557"/><text x="975" y="354" font-size="20" fill="#fff" text-anchor="middle" class="strong">M8</text><rect x="32" y="398" width="110" height="72" rx="12" fill="#e3ebf3" stroke="#354557"/><text x="87" y="440" font-size="20" fill="#152336" text-anchor="middle" class="strong">C</text><rect x="154" y="398" width="110" height="72" rx="12" fill="#e3ebf3" stroke="#354557"/><text x="209" y="440" font-size="20" fill="#152336" text-anchor="middle" class="strong">Dm</text><rect x="276" y="398" width="110" height="72" rx="12" fill="#e3ebf3" stroke="#354557"/><text x="331" y="440" font-size="20" fill="#152336" text-anchor="middle" class="strong">Em</text><rect x="398" y="398" width="110" height="72" rx="12" fill="#e3ebf3" stroke="#354557"/><text x="453" y="440" font-size="20" fill="#152336" text-anchor="middle" class="strong">F</text><rect x="554" y="398" width="110" height="72" rx="12" fill="#303b63" stroke="#354557"/><text x="609" y="440" font-size="20" fill="#fff" text-anchor="middle" class="strong">M1</text><rect x="676" y="398" width="110" height="72" rx="12" fill="#303b63" stroke="#354557"/><text x="731" y="440" font-size="20" fill="#fff" text-anchor="middle" class="strong">M2</text><rect x="798" y="398" width="110" height="72" rx="12" fill="#303b63" stroke="#354557"/><text x="853" y="440" font-size="20" fill="#fff" text-anchor="middle" class="strong">M3</text><rect x="920" y="398" width="110" height="72" rx="12" fill="#303b63" stroke="#354557"/><text x="975" y="440" font-size="20" fill="#fff" text-anchor="middle" class="strong">M4</text><text x="32" y="515" font-size="18" fill="#eaf0f5" >Hold a modifier, then play a chord. STOP releases notes and sustain.</text><text x="32" y="549" font-size="17" fill="#9fb3c8" >Melody: M1 → M16, bottom to top. Pitches depend on mode and harmony.</text><text x="32" y="581" font-size="14" fill="#9fb3c8" >Schematic colours identify pad roles here; see the guide for melody LED meanings.</text></svg>
